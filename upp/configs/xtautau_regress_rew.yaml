  - /dcache/atlas/sjankovy/mass_regress/mass_regress_v1/user.sjankovy.802168.e8558_s3797_r13144_p6453.tdd.FatJets_new.25_2_85.26-03-20_Htt_regress_v2_output.h5/*.h5 
qcd: &qcd
  name: qcd
  equal_jets: true
  pattern:
